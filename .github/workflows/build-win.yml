name: Build Windows x64 (MediaTok)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration (Release for public distribution, Debug for fast tests)'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - dev
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'

jobs:
  windows-x64:
    name: Windows x64 (${{ inputs.build_config || 'Debug' }})
    runs-on: windows-latest

    env:
      BUILD_CONFIG: ${{ inputs.build_config || 'Debug' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Configure SDK & Cache Keys
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/' | tr -d '\r')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$BUILD_CONFIG" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "builder@mediatok.local"
          git config --global user.name "MediaTok Builder"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Initialize MSVC x64 Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Configure NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Cache ThirdParty tools
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Cache Libraries (win64)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Cache Qt6 (win64)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Free disk space, skip unused dump_syms, and prune Qt Debug intermediates
        if: env.BUILD_CONFIG == 'Release'
        shell: bash
        run: |
          set -e
          df -h || true
          rm -rf /c/Android /c/Strawberry /c/msys64 /c/SeleniumWebDrivers \
                 /c/hostedtoolcache/windows/CodeQL /c/hostedtoolcache/windows/go \
                 /c/hostedtoolcache/windows/Ruby /c/hostedtoolcache/windows/Java* \
                 /c/ProgramData/chocolatey /c/mingw64 /c/ghcup /c/cabal /c/ProgramData/Kind \
                 "/c/Program Files/MongoDB" "/c/Program Files/MySQL" \
                 "/c/Program Files/PostgreSQL" "/c/Program Files/R" \
                 "/c/Program Files/Microsoft SQL Server" || true
          LIB_UNIX=$(cygpath -u "$LibrariesPath")
          if [ -d "$LIB_UNIX" ]; then
            find "$LIB_UNIX" -type f ! -path '*/objects-*' \( -name '*.obj' -o -name '*.pch' -o -name '*.idb' \) -delete || true
            if [ ! -f "$LIB_UNIX/cache_keys/qt_6.11.2" ]; then
              rm -rf "$LIB_UNIX"/[qQ]t* || true
            fi
          fi
          TBUILD_UNIX=$(cygpath -u "$TBUILD")
          PREP_UNIX="$TBUILD_UNIX/$REPO_NAME/$PREPARE_PATH"
          sed -i '/dump_syms/d' "$PREP_UNIX"
          python -c 'import pathlib; p = pathlib.Path(r"'"$TBUILD/$REPO_NAME/$PREPARE_PATH"'"); t = p.read_text(encoding="utf-8"); target = "    cmake --install . --config Debug\n    cmake --build .\n    cmake --install ."; repl = "    cmake --install . --config Debug\n    del /s /q *.obj *.pch >nul 2>nul\n    cmake --build .\n    cmake --install .\n    del /s /q *.obj *.pch >nul 2>nul"; assert target in t, "Qt6 block not found"; p.write_text(t.replace(target, repl, 1), encoding="utf-8")'
          grep -n -C 2 "del /s /q" "$PREP_UNIX"
          df -h || true

      - name: Build / Prepare Libraries
        run: |
          if "%BUILD_CONFIG%"=="Debug" (
            %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6
          ) else (
            %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6
          )

      - name: Free up intermediate disk space
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries Cache Immediately
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}

      - name: Save Qt6 Cache Immediately
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}

      - name: Speed up MSVC Release (skip slow /GL + /LTCG whole-program link)
        if: env.BUILD_CONFIG == 'Release'
        shell: bash
        run: |
          OPT_FILE="$TBUILD/$REPO_NAME/cmake/options_win.cmake"
          if [ -f "$OPT_FILE" ]; then
            sed -i 's|/GL||g; s|/LTCG[^ "]*||g' "$OPT_FILE" || true
          fi

      - name: Configure and Build MediaTok.exe
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
            -G "Ninja Multi-Config" ^
            qt6 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config %BUILD_CONFIG% --target Telegram --parallel

      - name: Prepare Artifact
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_CONFIG%
          mkdir artifact
          if exist "%OUT%\MediaTok.exe" move "%OUT%\MediaTok.exe" artifact\
          if exist "%OUT%\Telegram.exe" move "%OUT%\Telegram.exe" artifact\
          if exist "%OUT%\Updater.exe" move "%OUT%\Updater.exe" artifact\

      - name: Upload MediaTok Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTok-win64-${{ env.BUILD_CONFIG }}
          path: artifact\
          retention-days: 14

      - name: Publish Public Release (Release builds)
        if: env.BUILD_CONFIG == 'Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "win-release-$($env:GITHUB_RUN_NUMBER)"
          $zipPath = "$env:RUNNER_TEMP\MediaTok-win64-Release.zip"
          Compress-Archive -Path "artifact\*" -DestinationPath $zipPath -Force
          gh release create $tag $zipPath --repo ${{ github.repository }} --target ${{ github.sha }} --title "MediaTok Windows x64 ($tag)" --notes "Public Windows x64 Release build of MediaTok (commit $($env:GITHUB_SHA.Substring(0,7))). Extract and run MediaTok.exe." --latest
